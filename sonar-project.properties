# SonarQube Configuration for Nextape Project
# Documentation: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

# ═══════════════════════════════════════════════════════════════════════════════
# Project Identification
# ═══════════════════════════════════════════════════════════════════════════════
sonar.organization=skrsoftwarecr1
sonar.projectKey=skrsoftwarecr_nextape
sonar.projectName=Nextape
sonar.projectVersion=0.1.0

# ═══════════════════════════════════════════════════════════════════════════════
# Source & Test Files
# ═══════════════════════════════════════════════════════════════════════════════
# Note: SonarQube now auto-detects sources and tests based on file extensions
# The new analysis scope UX analyzes the whole project by default
# Remove sonar.sources, sonar.tests, and sonar.test.inclusions (deprecated)

# ═══════════════════════════════════════════════════════════════════════════════
# Exclusions (files to ignore in analysis)
# ═══════════════════════════════════════════════════════════════════════════════
# Exclude generated files, dependencies, and build artifacts
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.open-next/**,\
  **/.wrangler/**,\
  **/.genkit/**,\
  **/.git/**,\
  **/build/**,\
  **/dist/**,\
  **/coverage/**,\
  **/public/**,\
  **/graphify-out/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs

# Exclude test files from code coverage calculations (optional)
# sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ═══════════════════════════════════════════════════════════════════════════════
# Coverage (if you run tests with coverage)
# ═══════════════════════════════════════════════════════════════════════════════
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ═══════════════════════════════════════════════════════════════════════════════
# Language
# ═══════════════════════════════════════════════════════════════════════════════
sonar.language=ts
sonar.sourceEncoding=UTF-8

# ═══════════════════════════════════════════════════════════════════════════════
# Host (SonarCloud)
# ═══════════════════════════════════════════════════════════════════════════════
sonar.host.url=https://sonarcloud.io
