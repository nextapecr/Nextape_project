# SonarQube Configuration for Nextape Project
# Documentation: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

# ═══════════════════════════════════════════════════════════════════════════════
# Project Identification
# ═══════════════════════════════════════════════════════════════════════════════
sonar.organization=skrsoftwarecr1
sonar.projectKey=skrsoftwarecr_nextape
sonar.projectName=Nextape
sonar.projectVersion=0.1.0

# ═══════════════════════════════════════════════════════════════════════════════
# Source & Test Files
# ═══════════════════════════════════════════════════════════════════════════════
sonar.sources=src,app
sonar.tests=src,app
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ═══════════════════════════════════════════════════════════════════════════════
# Exclusions (files to ignore)
# ═══════════════════════════════════════════════════════════════════════════════
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/node_modules/**,\
  **/.next/**,\
  **/build/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.wrangler/**,\
  **/.genkit/**,\
  **/.open-next/**,\
  **/public/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/scripts/**

# ═══════════════════════════════════════════════════════════════════════════════
# Coverage (if you run tests with coverage)
# ═══════════════════════════════════════════════════════════════════════════════
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ═══════════════════════════════════════════════════════════════════════════════
# Language
# ═══════════════════════════════════════════════════════════════════════════════
sonar.language=ts
sonar.sourceEncoding=UTF-8

# ═══════════════════════════════════════════════════════════════════════════════
# Host (SonarCloud)
# ═══════════════════════════════════════════════════════════════════════════════
sonar.host.url=https://sonarcloud.io
