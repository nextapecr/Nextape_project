name: CI

on:
  push:
    branches: [main, develop, migration, thelineRAG]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Sin scripts de instalación: ningún paquete (ni una dependencia comprometida) ejecuta
        # código al instalarse. Typecheck, lint y tests no necesitan los binarios nativos de
        # tree-sitter (verificado 2026-10-29). Si un paso futuro los necesita, compilarlos
        # aparte con `npm rebuild <paquete>`.
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Config pública de Firebase (no secreta). Ajusta si cambia el proyecto.
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4462619429-470d8
