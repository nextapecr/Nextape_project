name: CI

on:
  push:
    branches: [main, develop, migration, thelineRAG]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # El test de Python del motor de GitHub necesita su gramática de tree-sitter, que no viene en el
      # paquete y se descarga. Se baja aquí, de forma explícita, en vez de dentro del test.
      - name: Pre-descargar gramáticas de tree-sitter
        run: npm run grammars:predownload

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Config pública de Firebase (no secreta). Ajusta si cambia el proyecto.
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-4462619429-470d8
